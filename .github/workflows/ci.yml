name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schema_designer_test?schema=public
  JWT_ACCESS_SECRET: ci-access-secret
  JWT_REFRESH_SECRET: ci-refresh-secret
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  CORS_ORIGIN: http://localhost:3000
  ANTHROPIC_API_KEY: ci-placeholder-key
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
  NEXT_PUBLIC_WS_URL: ws://localhost:4001

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests (all workspaces)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schema_designer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (all workspaces)
        run: npm ci

      - name: Generate Prisma client & run migrations
        working-directory: packages/database
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Lint
        run: npx turbo run lint

      - name: Typecheck
        run: npx turbo run check-types

      - name: Unit tests with coverage
        run: npx turbo run test -- --coverage

      - name: Upload API coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage

  build:
    name: Build all apps
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schema_designer_build
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schema_designer_build?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Build (turbo, dependency-ordered: packages before apps)"
        run: npx turbo run build

      - name: Upload web build output
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schema_designer_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schema_designer_e2e?schema=public
      PORT: 4000
      WS_PORT: 4001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Migrate database
        working-directory: packages/database
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Build packages + api + ws
        run: npx turbo run build --filter=@repo/api --filter=@repo/ws

      - name: Start API
        working-directory: apps/api
        run: node dist/server.js &

      - name: Start WebSocket server
        working-directory: apps/ws
        run: node dist/server.js &

      - name: Build web (production build, needed for Playwright's `npm run start`)
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
